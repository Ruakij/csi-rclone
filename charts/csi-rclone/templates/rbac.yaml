{{- if .Values.rbac.create }}
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "csi-rclone.fullname" . }}-controller
  labels:
    {{- include "csi-rclone.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments/status"]
    verbs: ["patch"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "csi-rclone.fullname" . }}-controller
  labels:
    {{- include "csi-rclone.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "csi-rclone.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "csi-rclone.fullname" . }}-controller
  apiGroup: rbac.authorization.k8s.io
---
# Leader election of the sidecars
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "csi-rclone.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi-rclone.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "create", "update", "patch", "delete"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "csi-rclone.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi-rclone.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "csi-rclone.controllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "csi-rclone.fullname" . }}-controller
  apiGroup: rbac.authorization.k8s.io
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "csi-rclone.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi-rclone.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["rclone-secret"]
    verbs: ["get"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "csi-rclone.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi-rclone.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "csi-rclone.nodeServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "csi-rclone.fullname" . }}-node
  apiGroup: rbac.authorization.k8s.io
{{- end }}
