{{- if .Values.rcloneSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  # The node plugin reads this name from its own namespace.
  name: rclone-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi-rclone.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.rcloneSecret.stringData | nindent 2 }}
{{- end }}
