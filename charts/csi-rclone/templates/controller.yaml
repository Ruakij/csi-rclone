apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "csi-rclone.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csi-rclone.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "csi-rclone.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "csi-rclone.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "csi-rclone.controllerServiceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: csi-provisioner
          image: "{{ .Values.provisioner.image.repository }}:{{ .Values.provisioner.image.tag }}"
          imagePullPolicy: {{ .Values.provisioner.image.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
            # PVC name and namespace, which pathPattern expands
            - --extra-create-metadata
            - --leader-election
            - --leader-election-namespace={{ .Release.Namespace }}
            - --v={{ .Values.logLevel }}
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.provisioner.resources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-attacher
          image: "{{ .Values.attacher.image.repository }}:{{ .Values.attacher.image.tag }}"
          imagePullPolicy: {{ .Values.attacher.image.pullPolicy }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace={{ .Release.Namespace }}
            - --v={{ .Values.logLevel }}
          securityContext: *restricted
          resources:
            {{- toYaml .Values.attacher.resources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: rclone
          image: {{ include "csi-rclone.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - /bin/csi-rclone-plugin
            - --nodeid=$(NODE_ID)
            - --endpoint=unix:///csi/csi.sock
            - --v={{ .Values.logLevel }}
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext: *restricted
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          emptyDir: {}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
