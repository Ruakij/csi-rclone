apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  # PersistentVolumes name the driver, so it cannot change per release.
  name: csi-rclone
  labels:
    {{- include "csi-rclone.labels" . | nindent 4 }}
spec:
  attachRequired: true
  # Tells ephemeral volumes apart in NodePublishVolume
  podInfoOnMount: true
  volumeLifecycleModes:
    - Persistent
    {{- if .Values.ephemeralVolumes }}
    - Ephemeral
    {{- end }}
