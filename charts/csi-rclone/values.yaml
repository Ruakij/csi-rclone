image:
  repository: ghcr.io/ruakij/csi-rclone
  tag: ""  # defaults to the chart appVersion
  pullPolicy: IfNotPresent

registrar:
  image:
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.18.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
  # Runs as root: it connects to the root-owned driver socket and creates its
  # registration socket in the root-owned kubelet plugin directory on the host.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

provisioner:
  image:
    repository: registry.k8s.io/sig-storage/csi-provisioner
    tag: v6.4.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# The driver has no ControllerPublishVolume, so the attacher only marks volumes
# attached. It stays because attachRequired cannot change on an existing CSIDriver.
attacher:
  image:
    repository: registry.k8s.io/sig-storage/csi-attacher
    tag: v4.13.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# Presets: k3s and RKE2 use /var/lib/kubelet by default but k3s installs that as a
# symlink to /var/lib/rancher/k3s/agent/kubelet; MicroK8s uses
# /var/snap/microk8s/common/var/lib/kubelet.
kubeletRootDir: /var/lib/kubelet

# Node plugin flags, see "Mount lifetime" and "rclone option allow-list" in the README.
daemonLifetime: auto  # auto | systemd | in-container
scopeMemoryMax: ""  # e.g. 2Gi
scopeTasksMax: 0
allowedBackends: []  # empty: all supported backends
allowedEndpoints: []  # empty: any host
# Gives whoever writes PersistentVolumes or rclone-secret root on every node.
unrestrictedRcloneOptions: false

# Inline CSI volumes in pod specs, see "Ephemeral volumes" in the README. Changing
# this on an existing release needs the CSIDriver deleted first, the field is immutable.
ephemeralVolumes: true
# Reuses a running rclone mount for any volume, PersistentVolume or ephemeral, whose
# rclone arguments match it exactly, credentials included, instead of starting another.
reuseMounts: true

# Default rclone settings for all volumes, read from the rclone-secret Secret in
# the release namespace. Leave create false to manage that Secret yourself.
rcloneSecret:
  create: false
  stringData: {}
    # remote: s3
    # s3-provider: Minio
    # s3-endpoint: http://minio.minio:9000
    # s3-access-key-id: ACCESS_KEY_ID
    # s3-secret-access-key: SECRET_ACCESS_KEY

storageClass:
  create: false
  name: rclone
  # Must contain ${.PVC.namespace} as a whole path segment, unless sharedRemote is "true".
  pathPattern: "${.PVC.namespace}/${.PVC.name}"
  sharedRemote: false
  reclaimPolicy: Delete

logLevel: 1

rbac:
  create: true
serviceAccount:
  create: true
  controllerName: ""
  nodeName: ""

controller:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  # For the rclone container; the sidecars use provisioner and attacher securityContext.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  nodeSelector: {}
  tolerations: []
  affinity: {}

node:
  priorityClassName: system-node-critical
  # A node agent belongs on every node.
  tolerations:
    - operator: Exists
  nodeSelector: {}
  affinity: {}
  # Requests only: with daemonLifetime in-container, rclone shares this
  # container's cgroup, and a limit would OOM-kill every mount on the node.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
  updateStrategy:
    type: RollingUpdate
  # The seccomp profile is not applied to the privileged rclone container, but it
  # covers the registrar. runAsNonRoot is unset: the rclone container needs root
  # to mount and the registrar needs it to reach the root-owned host directories.
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  # For the rclone container. Privileged is required for mounting FUSE with
  # Bidirectional propagation, and Kubernetes rejects allowPrivilegeEscalation
  # false on privileged containers, so it is unset.
  securityContext:
    privileged: true
    readOnlyRootFilesystem: true

podAnnotations: {}
podLabels: {}
