version: "2"

run:
  # The e2e test is linted too, even though only its own CI job runs it.
  build-tags: [e2e]

linters:
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - nilerr
    - rowserrcheck
    - unconvert
    - wastedassign
    - revive
  settings:
    revive:
      rules:
        - name: unused-parameter
  exclusions:
    presets:
      # Close and os.Remove on cleanup paths, with nothing to report the error to.
      - std-error-handling
