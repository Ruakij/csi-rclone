version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # Released in lockstep; they do not compile against mismatched versions.
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      go-dependencies:
        patterns: ["*"]
        exclude-patterns: ["k8s.io/*", "sigs.k8s.io/*"]
        update-types: [minor, patch]
    ignore:
      # Vulnerable to GO-2026-6443, which 1.83.2 is patched for
      - dependency-name: google.golang.org/grpc
        versions: ["1.84.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
