version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # Released in lockstep; they do not compile against mismatched versions.
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      go-dependencies:
        patterns: ["*"]
        exclude-patterns: ["k8s.io/*", "sigs.k8s.io/*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
