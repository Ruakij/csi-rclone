# Versions that live in files Dependabot cannot parse: the golangci-lint version in
# hack/golangci-lint.version and the CSI sidecar image tags in the chart's
# values.yaml. This bumps them and opens a PR per upstream.
#
# Detection runs in jobs without credentials, so upstream data never reaches a token
# that can write. Only the PR jobs can write.
#
# Events caused by GITHUB_TOKEN start no workflows, except workflow_dispatch. After
# every push to a PR branch the PR job therefore dispatches ci.yaml on that branch;
# the run attaches its checks to the PR head commit.
name: upstream-sync

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golangci-lint-check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      current: ${{ steps.detect.outputs.current }}
      latest: ${{ steps.detect.outputs.latest }}
      result: ${{ steps.lint.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(cat hack/golangci-lint.version)
          latest=$(gh release view --repo golangci/golangci-lint --json tagName -q .tagName)
          [[ "${latest}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          [ "${current}" = "${latest}" ] && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      # A new release usually means new checks, so let the PR say whether we pass.
      - if: steps.detect.outputs.changed == 'true'
        id: lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.detect.outputs.latest }}

  golangci-lint-pr:
    needs: golangci-lint-check
    if: needs.golangci-lint-check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: upstream-sync-golangci-lint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - env:
          LATEST: ${{ needs.golangci-lint-check.outputs.latest }}
        run: echo "${LATEST}" > hack/golangci-lint.version

      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/golangci-lint-version-sync
          delete-branch: true
          commit-message: "Bump golangci-lint to ${{ needs.golangci-lint-check.outputs.latest }}"
          title: "Bump golangci-lint to ${{ needs.golangci-lint-check.outputs.latest }}"
          body: |
            Automated golangci-lint upstream sync.

            - Previous: `${{ needs.golangci-lint-check.outputs.current }}`
            - New: `${{ needs.golangci-lint-check.outputs.latest }}`

            Result of running the new version against the tree: `${{ needs.golangci-lint-check.outputs.result }}`.
            A failure here is expected when a release adds checks; the findings are in the
            job log of the run that opened this PR.

      # A push or a new PR starts no CI, so dispatch it. An unchanged branch gets a run
      # only when none exists for its head yet, which retries a lost dispatch.
      - if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
          SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
          BRANCH: automation/golangci-lint-version-sync
        run: |
          set -euo pipefail
          if [ "${OPERATION}" = none ] && [ "$(gh run list --workflow ci.yaml --commit "${SHA}" --json databaseId -q length)" != 0 ]; then
            exit 0
          fi
          gh workflow run ci.yaml --ref "${BRANCH}"

  sidecar-detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    env:
      VALUES: charts/csi-rclone/values.yaml
      # One "<values.yaml key> <upstream repo>" pair per line.
      SIDECARS: |-
        registrar kubernetes-csi/node-driver-registrar
        provisioner kubernetes-csi/external-provisioner
        attacher kubernetes-csi/external-attacher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sorted rather than "latest": upstream also cuts patch releases for older
      # minors, which GitHub may flag as the latest release. The PR job gets the
      # entries that need a bump as its matrix.
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          include='[]'
          failed=0
          while read -r key repo; do
            [ -n "${key}" ] || continue
            current=$(sed -n "/^${key}:/,/^[^ ]/ s/^    tag: //p" "${VALUES}")
            if ! latest=$(gh release list --repo "${repo}" --exclude-pre-releases --exclude-drafts --limit 30 --json tagName -q '.[].tagName' | sort -V | tail -1) || [[ ! "${latest}" =~ ${semver} ]]; then
              echo "::warning::${repo}: no semver release found"
              failed=1
              continue
            fi
            [ "$(printf '%s\n' "${current}" "${latest}" | sort -V | tail -1)" != "${current}" ] || continue
            include=$(jq -c --arg key "${key}" --arg repo "${repo}" --arg current "${current}" --arg latest "${latest}" \
              '. + [{key: $key, repo: $repo, current: $current, latest: $latest}]' <<< "${include}")
          done <<< "${SIDECARS}"
          echo "matrix=${include}" >> "$GITHUB_OUTPUT"
          # The sidecars that did work still get their PRs; this only marks the run red.
          exit "${failed}"

  sidecar-pr:
    needs: sidecar-detect
    # Runs after a failed detect too: the matrix output holds the sidecars that worked.
    if: ${{ !cancelled() && needs.sidecar-detect.outputs.matrix != '' && needs.sidecar-detect.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.sidecar-detect.outputs.matrix) }}
    concurrency:
      group: upstream-sync-${{ matrix.key }}
      cancel-in-progress: true
    env:
      VALUES: charts/csi-rclone/values.yaml
      BRANCH: automation/${{ matrix.key }}-version-sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - env:
          KEY: ${{ matrix.key }}
          LATEST: ${{ matrix.latest }}
        run: |
          sed -i "/^${KEY}:/,/^[^ ]/ s/^\(    tag: \).*/\1${LATEST}/" "${VALUES}"

      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ env.BRANCH }}
          delete-branch: true
          commit-message: "Bump ${{ matrix.repo }} to ${{ matrix.latest }}"
          title: "Bump ${{ matrix.repo }} to ${{ matrix.latest }}"
          body: |
            Automated CSI sidecar upstream sync.

            - Previous: `${{ matrix.current }}`
            - New: `${{ matrix.latest }}`

            The `e2e` job runs the chart with the new image in kind.

      # A push or a new PR starts no CI, so dispatch it. An unchanged branch gets a run
      # only when none exists for its head yet, which retries a lost dispatch.
      - if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
          SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          if [ "${OPERATION}" = none ] && [ "$(gh run list --workflow ci.yaml --commit "${SHA}" --json databaseId -q length)" != 0 ]; then
            exit 0
          fi
          gh workflow run ci.yaml --ref "${BRANCH}"
